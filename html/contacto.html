    <link rel="icon" href="../IMG/favicon.png" type="image/png">

    <!--Preload-->
    <link rel="preload" as="style" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/normalize.css">

    <link rel="preload" href="https://fonts.googleapis.com" crossorigin="crossorigin" as="font">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preload" href="https://fonts.gstatic.com" crossorigin="crossorigin" as="font">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" crossorigin="crossorigin" as="font">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
    <link rel="preload" href="../css/style.css" as="style">
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <header>
        <h1 class="titulo">Glow Studio</h1>
    </header>

    <div class="nav-bg">
        <nav class="navegacion-principal">

            <div class="contenedor-logo">
                <a href="index.html">Glow Studio</a>
            </div>
            
            <div class="menu">
                <a href="clases.html">Clases</a>
                <a href="paquetes.html">Paquetes</a>
                <a href="disciplinas.html">Disciplinas</a>
                <a href="contacto.html">Contacto</a>
            </div>

            <div class="img-logo">
                <a id="nav-user-link" href="login.html">
                    <picture>
                        <source loading="lazy" srcset="../IMG/usuario.webp" type="image/webp">
                        <img src="../IMG/usuario.png" alt="Logo usuario" loading="lazy">
                    </picture>
                </a>
                
                <a href="https://www.instagram.com/neyra_lop?igsh=a3dhZzMzbnRkN2c4" target="_blank" rel="noopener noreferrer" loading="lazy">
                    <picture>
                        <source loading="lazy" srcset="../IMG/logo-instagram.webp" type="image/webp">
                        <img src="../IMG/logo-instagram.png" alt="Logo instagram">
                    </picture>
                </a>
            </div>

        </nav>
    </div>
    <main>
        <section>
            <h2 class="centrar-texto">Contacto</h2>
            <form id="contacto-form" class="formulario">
                <fieldset>
                    <legend>Contactanos llenando todos los campos</legend>

                    <div class="contenedor-campos">
                        <div class="campo">
                            <label for="">Nombre</label>
                            <input id="contacto-nombre" type="text" placeholder="Escribe tu nombre">
                        </div>

                        <div class="campo">
                            <label for="">Telefono</label>
                            <input id="contacto-telefono" type="tel" placeholder="Escribe tu numero de telefono">
                        </div>

                        <div class="campo">
                            <label for="">Correo</label>
                            <input id="contacto-correo" type="email" placeholder="Escribe tu correo">
                        </div>
                        
                        <div class="campo">
                            <label for="contacto-mensaje">Mensaje</label>
                            <textarea id="contacto-mensaje" maxlength="500"></textarea>
                            <small id="contacto-char-count" style="color:#888;font-size:0.85rem;">0/500</small>
                        </div>
                    </div> <!--.contendor-compos-->

                    <div class="enviar flex alinear-derecha">
                        <input id="contacto-submit" class="boton w-sm-100" type="submit" value="Enviar">
                    </div>
                    <p id="contacto-msg" style="min-height:1.8rem;"></p>

                </fieldset>
            </form>
        </section>
    </main>

    <footer class="footer">
        <nav>
            <a href="#">Contacto</a>
            <a href="#">Paquetes</a>
            <a href="#">Terminos y condiciones de privacidad</a>
        </nav>

    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/contacto.js"></script>
    <script>Auth.updateNavAuthState();</script>
</body>
</html>
