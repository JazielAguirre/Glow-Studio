<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Glow Studio</title>

    <link rel="icon" href="../IMG/favicon.png" type="image/png">

    <link rel="preload" as="style" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/normalize.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <link rel="preload" as="style" href="../css/style.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1 class="titulo">Glow Studio</h1>
    </header>

    <div class="nav-bg">
        <nav class="navegacion-principal">

            <div class="contenedor-logo">
                <a href="index.html">Glow Studio</a>
            </div>

            <div class="menu">
                <a href="clases.html">Clases</a>
                <a href="paquetes.html">Paquetes</a>
                <a href="disciplinas.html">Disciplinas</a>
                <a href="contacto.html">Contacto</a>
            </div>

            <div class="img-logo">
                <a id="nav-user-link" href="login.html">
                    <picture>
                        <source loading="lazy" srcset="../IMG/usuario.webp" type="image/webp">
                        <img src="../IMG/usuario.png" alt="Iniciar sesión" loading="lazy">
                    </picture>
                </a>
                <a href="https://www.instagram.com/neyra_lop?igsh=a3dhZzMzbnRkN2c4" target="_blank" rel="noopener noreferrer">
                    <picture>
                        <source loading="lazy" srcset="../IMG/logo-instagram.webp" type="image/webp">
                        <img src="../IMG/logo-instagram.png" alt="Instagram" loading="lazy">
                    </picture>
                </a>
            </div>

        </nav>
    </div>

    <main class="contenedor-paquetes">
        <section class="grid-login">
            <form id="register-form" class="formulario-login">
                <fieldset>
                    <legend>Crear cuenta</legend>
                    <p>Regístrate para reservar clases y gestionar tus paquetes.</p>

                    <div class="contenedor-login">
                        <div class="login-campo">
                            <label for="nombre-input">Nombre completo</label>
                            <input id="nombre-input" type="text" placeholder="Ingresa tu nombre">
                        </div>

                        <div class="login-campo">
                            <label for="email-input">Correo electrónico</label>
                            <input id="email-input" type="email" placeholder="Ingresa tu correo">
                        </div>

                        <div class="login-campo">
                            <label for="password-input">Contraseña</label>
                            <input id="password-input" type="password" placeholder="Mínimo 8 caracteres">
                        </div>

                        <div class="login-campo">
                            <label for="confirm-input">Confirmar contraseña</label>
                            <input id="confirm-input" type="password" placeholder="Repite tu contraseña">
                        </div>

                        <div class="login">
                            <input class="boton w-sm-100" type="submit" value="Crear cuenta">
                        </div>
                    </div>

                    <p id="register-error" style="color:#f06449;min-height:1.8rem;"></p>
                    <p id="register-success" style="color:#56382D;min-height:1.8rem;"></p>
                    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí.</a></p>

                </fieldset>
            </form>

            <div class="img-login">
                <picture>
                    <source loading="lazy" srcset="../IMG/coach.webp" type="image/webp">
                    <img src="../IMG/coach.jpg" alt="Imagen de registro" loading="lazy">
                </picture>
            </div>
        </section>
    </main>

    <footer class="footer">
        <nav>
            <a href="contacto.html">Contacto</a>
            <a href="paquetes.html">Paquetes</a>
            <a href="#">Términos y condiciones</a>
        </nav>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        Auth.redirectIfLoggedIn('index.html');
        Auth.handleRegisterForm();
    </script>
</body>
</html>
