<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis compras — Glow Studio</title>

    <link rel="icon" href="../IMG/favicon.png" type="image/png">

    <link rel="preload" as="style" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/normalize.css">

    <link rel="preload" href="https://fonts.googleapis.com" crossorigin="crossorigin" as="font">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="https://fonts.gstatic.com" crossorigin="crossorigin" as="font">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" crossorigin="crossorigin" as="font">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic:wght@100..400&family=Playwrite+NZ:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <link rel="preload" href="../css/style.css" as="style">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .compras-wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
        .compras-titulo { font-size: 2.4rem; font-weight: 700; color: #3d2b1f; margin-bottom: 2rem; text-align: center; }
        .compra-card {
            background: #fff;
            border: 1.5px solid #e8ddd5;
            border-radius: 14px;
            padding: 1.4rem 1.6rem;
            margin-bottom: 1.2rem;
            transition: box-shadow 0.2s;
        }
        .compra-card:hover { box-shadow: 0 4px 18px rgba(89,56,45,0.09); }
        .compra-card.estado-inactivo { opacity: 0.7; border-color: #e0e0e0; }
        .compra-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.5rem;
        }
        .compra-folio { font-size: 1.2rem; color: #9a7060; font-family: monospace; }
        .compra-estado {
            font-size: 1.1rem; font-weight: 700; padding: 0.2rem 0.8rem;
            border-radius: 20px; letter-spacing: 0.04em;
        }
        .estado-activo .compra-estado { background: #d4edda; color: #155724; }
        .estado-inactivo .compra-estado { background: #fde8cc; color: #7a4a10; }
        .compra-nombre { font-size: 1.8rem; font-weight: 700; color: #c9956a; margin: 0.3rem 0 0.9rem; }
        .compra-detalle {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.6rem 1rem;
        }
        .compra-detalle > div { font-size: 1.3rem; }
        .compra-detalle span { display: block; color: #9a7060; font-size: 1.1rem; text-transform: uppercase;
            letter-spacing: 0.06em; }
        .compra-detalle strong { color: #3d2b1f; }
        .compras-vacio { text-align: center; color: #9a7060; font-size: 1.5rem; padding: 3rem 0; }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo">Glow Studio</h1>
    </header>

    <div class="nav-bg">
        <nav class="navegacion-principal">
            <div class="contenedor-logo">
                <a href="index.html">Glow Studio</a>
            </div>
            <div class="menu">
                <a href="clases.html">Clases</a>
                <a href="paquetes.html">Paquetes</a>
                <a href="disciplinas.html">Disciplinas</a>
                <a href="contacto.html">Contacto</a>
            </div>
            <div class="img-logo">
                <a id="nav-user-link" href="login.html">
                    <picture>
                        <source loading="lazy" srcset="../IMG/usuario.webp" type="image/webp">
                        <img src="../IMG/usuario.png" alt="Logo usuario" loading="lazy">
                    </picture>
                </a>
                <a href="https://www.instagram.com/neyra_lop?igsh=a3dhZzMzbnRkN2c4" target="_blank" rel="noopener noreferrer" loading="lazy">
                    <picture>
                        <source loading="lazy" srcset="../IMG/logo-instagram.webp" type="image/webp">
                        <img src="../IMG/logo-instagram.png" alt="Logo instagram">
                    </picture>
                </a>
            </div>
        </nav>
    </div>

    <main>
        <div class="compras-wrap">
            <h2 class="compras-titulo">Mis compras</h2>
            <div id="mis-paquetes-container"><p class="compras-vacio">Cargando...</p></div>
        </div>
    </main>

    <footer class="footer">
        <nav>
            <a href="#">Contacto</a>
            <a href="paquetes.html">Paquetes</a>
            <a href="#">Términos y condiciones de privacidad</a>
        </nav>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/mis-paquetes.js"></script>
    <script>Auth.updateNavAuthState();</script>
</body>
</html>
